<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<title>Refer and Earn Prototype</title>
<style>
:root{--blue:#0b4ea2;--blue-d:#08397a;--blue-l:#e8f0fb;--red:#e30613;--ink:#0f1b33;--mute:#667391;--bg:#f3f5f9;--line:#e1e6ef;--green:#1b7f3a;--green-l:#e5f4ea;--amber:#fff6dd;--gut:16px;--gx:16px;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#cdd5e3;color:var(--ink);display:flex;justify-content:center;font-size:15px;line-height:1.4}
button{font:inherit;color:inherit}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#phone{width:100%;max-width:430px;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#top{background:#0c1a33;padding:10px var(--gx);display:flex;gap:8px;align-items:center;flex:none}
.pill{border:1.5px solid rgba(255,255,255,.85);color:#fff;background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.on{background:#fff;color:#0c1a33;border-color:#fff}
.lnk{color:#fff;background:none;border:0;font-weight:600;font-size:13.5px;cursor:pointer;padding:6px 4px;white-space:nowrap}
#main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0;scroll-behavior:smooth}
#nav{flex:none;position:relative;z-index:5;display:flex;background:#fff;border-top:1px solid var(--line);padding:4px var(--gx) calc(6px + env(safe-area-inset-bottom))}
#nav button{flex:1;background:none;border:0;color:var(--mute);font-size:11.5px;padding:7px 0 4px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button svg{font-size:22px}
#nav button.on{color:var(--blue);font-weight:700}
#nav button.on::before{content:"";position:absolute;top:-5px;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.badge{position:absolute;top:1px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 6px;font-weight:700}
.page{padding:16px var(--gx) 28px}
.narrow{max-width:560px;margin:0 auto;padding-left:16px!important;padding-right:16px!important}
.g2{display:block}.gc{min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:12px var(--gx);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar h1{font-size:17px;flex:1;font-weight:700}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--ink)}
h2{font-size:20px;font-weight:800;margin:4px 0 10px}
h3{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--ink)}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;text-align:center}
.btn.white{background:#fff;color:var(--blue)}
.btn.ghost{background:#fff;color:var(--mute);border:1.5px solid var(--line)}
.btn.sm{width:auto;display:inline-flex;padding:9px 16px;font-size:14px;border-radius:12px}
.btn:active,.opt:active,.ibtn:active{transform:scale(.98)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mute{color:var(--mute);font-size:13px}.small{font-size:12px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--green-l);color:#175f2d;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip.blue{background:var(--blue-l);color:var(--blue)}
/* home header */
.hdr{background:linear-gradient(180deg,#0b4ea2 0%,#2a6fc9 70%,#3b7fd6 100%);padding:14px var(--gx) 16px;color:#fff}
.modes{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 2px 4px;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}
.mode{flex:none;width:74px;height:86px;border-radius:18px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;padding-bottom:10px;font-size:12px;font-weight:700;scroll-snap-align:start;position:relative;box-shadow:0 6px 16px rgba(5,30,80,.22)}
.mode .ico{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px}
.mode.on{outline:3px solid #0c1a33;outline-offset:1px}
.mb{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#0c1a33;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.2px}
.mb.new{background:var(--red)}.mb.sav{background:#0f8a4b}
.srow{display:flex;gap:10px;align-items:stretch}
.srow .search{flex:1;min-width:0}
.buyagain{flex:none;background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:14px;padding:0 12px;font-weight:800;font-size:12.5px;line-height:1.1;display:flex;align-items:center;gap:6px;text-align:left}
.buyagain svg{font-size:18px}
.cat{display:inline-flex;align-items:center;gap:6px}.cat svg{font-size:16px}
.cats{padding-top:14px}
.shareorb{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#e8458a,#c4125c);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 8px 18px rgba(196,18,92,.4);border:4px solid #fff;flex:none;pointer-events:none}
.shareorb svg{font-size:24px}
.navc{flex:1;display:flex;justify-content:center;align-items:flex-start}
.card{box-shadow:0 1px 2px rgba(15,27,51,.04),0 8px 22px rgba(15,27,51,.05)}
body{background:radial-gradient(1200px 700px at 20% 0%,#e8eefb 0%,#c9d3e6 60%,#bcc8de 100%)}
.slot{display:flex;align-items:center;gap:10px;margin:12px 0}
.slotpill{background:#0c1a33;color:#fff;border-radius:10px;padding:8px 11px;font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.addr{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;min-width:0;flex:1}.addr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;color:var(--mute);font-size:14.5px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:12px var(--gx) 4px;scrollbar-width:none;background:var(--bg)}.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink)}.cat.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.banner{margin:12px var(--gx);border-radius:var(--r);padding:18px;color:#fff;background:linear-gradient(115deg,#e30613 0%,#b1055f 55%,#0b4ea2 100%);min-height:96px;display:flex;flex-direction:column;justify-content:center}
.banner b{font-size:19px}.banner span{font-size:13px;opacity:.95;margin-top:4px}
.sect{padding:0 var(--gx)}


.prod{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.prod:last-child{border:0}
.prod .pn{font-weight:600;min-width:0}.prod s{color:var(--mute);font-size:12px;margin-left:4px}
.qty{display:flex;align-items:center;gap:10px;flex:none}.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-size:19px;cursor:pointer;line-height:1}
/* reward */
.reveal{background:linear-gradient(120deg,#d10f61,#e8458a);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;cursor:pointer;display:block;width:100%;text-align:left;border:0}
.reveal small{letter-spacing:.16em;font-weight:700;font-size:11.5px;display:block}.reveal div{font-size:21px;font-weight:800;margin-top:4px}
.revealed{background:var(--green-l);color:#175f2d;border-radius:var(--r);padding:14px;margin-bottom:12px;font-weight:600}
/* refer hero + levels */
.hero{background:linear-gradient(160deg,#0b4ea2,#2a6fc9);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.hero .big{font-size:24px;font-weight:800;line-height:1.2;margin:2px 0 6px}
.lvls{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -16px 0;padding:0 16px 4px;scrollbar-width:none}.lvls::-webkit-scrollbar{display:none}
.lvl{flex:none;width:78%;scroll-snap-align:start;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);text-align:left;color:#fff;min-height:128px;display:flex;flex-direction:column;gap:5px}
.lvl.lock{background:rgba(8,30,70,.35);border-color:rgba(255,255,255,.18);cursor:pointer}
.lvl .lh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:#cfe1ff}
.lvl .blur{filter:blur(4.5px);font-weight:700;font-size:15px;user-select:none;pointer-events:none}
.lvl .un{font-size:13px;font-weight:700}
.lvl .tg{font-size:13px;color:#dbe8ff}
.pbar{height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;margin:12px 0 6px}.pbar b{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s}
.pbar.dark{background:#e3e9f3}.pbar.dark b{background:var(--blue)}
.st{font-size:12.5px;font-weight:700;white-space:nowrap}.st.paid{color:var(--green)}.st.way{color:#a85d00}.st.joined{color:var(--blue)}.st.invited{color:var(--mute)}
.fl{padding:11px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.fl:last-child{border:0}.fl b{font-weight:600}
.ibtn{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;font-size:14px}
/* sheets */
#overlay{position:absolute;inset:0;background:rgba(10,20,45,.55);display:flex;align-items:flex-end;z-index:30}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px var(--gut) calc(22px + env(safe-area-inset-bottom));max-height:90%;overflow-y:auto;position:relative}
.sheet .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;background:var(--bg);border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sheet h2{padding-right:38px;font-size:19px;line-height:1.3}
.bubble{background:#dff3c9;border-radius:14px;padding:14px;font-size:14.5px;line-height:1.5;margin:12px 0}
.link{display:inline-block;background:#fff;color:var(--blue);padding:5px 11px;border-radius:999px;font-weight:700;font-size:13px;margin-top:8px}
.send{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.sendb{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13.5px;cursor:pointer}
.sendb i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-style:normal}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer;font-size:14px}.opt.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.note{background:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.ok{background:var(--green-l);color:#175f2d;border-radius:12px;padding:11px 12px;font-weight:600;margin:10px 0 6px}
.grey{opacity:.5}
.sum .l{display:flex;justify-content:space-between;padding:5px 0}.sum .l.t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:16px}
.center{text-align:center}
.tick{width:56px;height:56px;border-radius:50%;background:var(--green-l);color:var(--green);display:flex;align-items:center;justify-content:center;margin:2px auto 10px;font-size:30px}
.log{font-size:12.5px;line-height:1.6;color:var(--ink)}.log .no{color:#a85d00}.log .yes{color:var(--green)}
.lv4{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.lv4:last-child{border:0}
.dot{width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--mute);flex:none}.dot.cur{background:var(--blue);color:#fff}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0}.entry .a{font-weight:700}.entry .a.neg{color:#b3261e}.entry .a.pos{color:var(--green)}.entry .a.pen{color:#a85d00}
.prof{display:flex;gap:14px;align-items:center;margin:4px 0 14px}.av{width:56px;height:56px;border-radius:50%;background:#0b4ea2;color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center;flex:none}.pic{width:36px;height:36px;border-radius:10px;background:#eef3fb;color:#0b4ea2;display:grid;place-items:center;flex:none}.pic svg{width:20px;height:20px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.stats b{display:block;font-size:15px}.stats span{font-size:11.5px;color:var(--mute)}
.promo{background:#0f4d2e;color:#fff;font-size:13px;font-weight:600;padding:9px var(--gx)}
.dsk{display:none}
#main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
html,body{height:100%}


.logo{display:none}.flag{display:none}.banner .code{display:none}

@media(min-width:600px){body{align-items:center}#phone{max-width:430px;height:min(880px,calc(100dvh - 24px));border-radius:36px;box-shadow:0 24px 70px rgba(10,25,60,.38)}}

/* ===== v7 premium polish ===== */
.logo b{color:#fff!important}.logo .lm{filter:brightness(1.3)}.addr,.addr span{color:#cfe0ff!important}
@media(min-width:700px){.lp{margin-top:18px}.lp .top{border-radius:28px 28px 34px 34px}}

:root{--blue:#0a3d8f;--blue-d:#072a66;--blue-l:#eaf1fc;--gold:#e9b949;--gold-d:#b8860b;--bg:#f6f7fb;--line:#e6e9f1;--sh1:0 1px 2px rgba(16,28,60,.05),0 6px 18px rgba(16,28,60,.06);--sh2:0 12px 32px rgba(10,40,100,.18);--r:18px}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h2{letter-spacing:-.02em;font-weight:800}
#top{background:linear-gradient(90deg,#08142b,#0e2149)}
.card{border:1px solid rgba(225,230,240,.9);box-shadow:var(--sh1);border-radius:var(--r);padding:16px}
.btn{background:linear-gradient(135deg,#0d4bb0,#072a66);box-shadow:0 8px 20px rgba(7,42,102,.28);border-radius:16px;padding:15px 18px;letter-spacing:.1px}
.btn.white{background:#fff;box-shadow:var(--sh1);color:var(--blue)}
.btn.ghost{box-shadow:none}
.btn.cta{background:linear-gradient(135deg,#f0c354,#e1a62b);color:#2b1d00;box-shadow:0 10px 24px rgba(225,166,43,.45)}
.chip{border:1px solid rgba(23,95,45,.15)}
.hero{background:radial-gradient(120% 140% at 100% 0%,#2f78db 0%,transparent 55%),linear-gradient(155deg,#0a3d8f 0%,#072a66 100%);border-radius:24px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.hdr{background:linear-gradient(180deg,#072a66 0%,#0a3d8f 60%,#1d63c6 100%)}
#nav{box-shadow:0 -8px 24px rgba(16,28,60,.07);border-top:0}
.bar{backdrop-filter:blur(10px);background:rgba(255,255,255,.92)}
.mode{box-shadow:0 6px 16px rgba(5,20,60,.22)}
.fl{border-radius:14px}
.opts{display:none}
/* credit slider */
.slide{background:linear-gradient(180deg,#fff,#f5f8ff);border:1px solid #d9e4fa;border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--sh1)}
.slide .sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.slide .sh span{font-weight:700;font-size:14px}
.slide .sh b{font-size:26px;letter-spacing:-.03em;color:var(--blue)}
.slide input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;margin:2px 0}
.slide input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--blue) var(--p,100%),#dbe3f3 var(--p,100%))}
.slide input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:#dbe3f3}
.slide input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--blue)}
.slide input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-top:-11px;box-shadow:0 4px 12px rgba(7,42,102,.35)}
.slide input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
.slide .tk{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:600;padding:0 4px}
.slide .tk span.on{color:var(--blue);font-weight:800}
/* Omar landing */
.lp{padding:0 0 28px;max-width:560px;margin:0 auto}
.lp .top{position:relative;overflow:hidden;color:#fff;padding:26px 22px 78px;background:radial-gradient(90% 70% at 90% 0%,#3a86ee 0%,transparent 60%),radial-gradient(70% 60% at 0% 100%,#c4125c55 0%,transparent 60%),linear-gradient(160deg,#0a3d8f,#061f4d);border-radius:0 0 34px 34px}
.lp .conf{position:absolute;inset:0;pointer-events:none}
.lp .from{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;font-size:13.5px}
.lp .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f0c354,#e1a62b);color:#3a2600;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.lp .gift{font-size:58px;line-height:1;margin:18px 0 4px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.lp .amt{font-size:64px;font-weight:900;letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff4c8,#f0c354 60%,#e1a62b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp .amt small{font-size:26px;font-weight:800;margin-right:6px;letter-spacing:0}
.lp .sub{font-size:19px;font-weight:700;margin-top:6px}
.lp .fine{margin-top:8px;font-size:13px;color:#cfe0ff;font-weight:600}
.lp .tkt{position:relative;margin:-52px 16px 0;background:#fff;border-radius:22px;box-shadow:var(--sh2);padding:18px 18px 16px}
.lp .code{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px dashed #c9d6f2;border-radius:14px;padding:12px 14px;background:#f5f8ff;margin-bottom:22px}
.lp .code b{font-size:20px;letter-spacing:.14em;color:var(--blue)}
.lp .code span{font-size:12px;color:#175f2d;background:var(--green-l);padding:4px 10px;border-radius:99px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.lp .steps{display:flex;gap:10px;margin:6px 0 16px}
.lp .st{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink)}
.lp .st i{display:flex;width:44px;height:44px;margin:0 auto 6px;border-radius:14px;background:var(--blue-l);align-items:center;justify-content:center;font-style:normal;font-size:22px}
.lp .ban{display:flex;gap:12px;overflow-x:auto;padding:18px 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}.lp .ban::-webkit-scrollbar{display:none}
.lp .b{flex:none;width:78%;max-width:260px;scroll-snap-align:start;border-radius:20px;padding:16px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;box-shadow:var(--sh1)}
.lp .b em{position:absolute;right:10px;top:4px;font-style:normal;font-size:54px;opacity:.95}
.lp .b b{font-size:16px;line-height:1.2;max-width:75%}.lp .b span{font-size:12px;opacity:.9;margin-top:3px}
.lp .b1{background:linear-gradient(135deg,#0f9d58,#07663a)}.lp .b2{background:linear-gradient(135deg,#e30613,#a30210)}.lp .b3{background:linear-gradient(135deg,#7a3fe0,#43208f)}

  const ov=$('#overlay'),sv=sheetView(),sk=S.sheet?S.sheet+(S.sd||''):'',fresh=!!sk&&render.sk!==sk;render.sk=sk;
  ov.style.display=sv?'flex':'none';ov.innerHTML=sv;ov.classList.toggle('fresh',fresh);
  if(fresh&&S.sheet==='reward')burst(64);if(fresh&&S.sheet==='confirm')burst(34);if(newKey&&S.sub==='welcome')burst(54);
  const cc=cartCount();if(render.cc!==undefined&&cc>render.cc)document.querySelectorAll('.badge').forEach(b=>b.classList.add('bump'));render.cc=cc;
  countUps()}

/* ============ ACTIONS ============ */
function placeOmar(){const o=S.o,sub=subtotal(),used=o.sel||0,first=o.orders.length===0,id=1000+o.orders.length+1;
  if(used)o.ledger.unshift({id:'U'+id,t:'Used on order #'+id,amt:-used,st:'ok',note:'Referral credit'});
  o.orders.push({id,status:'placed',sub});o.cart={};
  S.sheet='placed';S.sd={used,left:bal(o.ledger)};
  track(first?'first_order_placed':'second_order_placed','credit used '+used);
  if(first){setFriend('Omar R.','way');S.a.pendingPrompt=true;S.a.ledger.unshift({id:'L2',t:'Referral reward · Omar R.',amt:CFG.reward,st:'pending',note:'Will be credited within '+CFG.holdWorkingDays+' working days'});track('reward_pending','AED '+CFG.reward)}
  else{o.orders[o.orders.length-1].status='delivered'}}
function placeAisha(){const a=S.a,sub=subtotal(),was=wasTotal(),pct=was>0?Math.round((was-sub)/was*100):0;
  a.orders.push({id:2000+a.orders.length+1,status:'placed',pct});if(pct>=CFG.savingPct)a.nudge2=pct;else S.log.unshift({n:'Nudge 2: saving under '+CFG.savingPct+'%',ok:false,why:'saving was '+pct+'%'});a.cart={};S.sheet='placed';S.sd={aisha:true};track('aisha_order_placed','saving '+pct+'%')}
function act(a,d){const A=S.a,O=S.o;
  switch(a){
  case 'who':S.who=d.v;S.tab='home';S.sub=null;S.sheet=null;S.sd=null;if(d.v==='omar'){if(!A.friends.find(f=>f.n==='Omar R.'))setFriend('Omar R.','invited');if(O.stage==='landing')track('referral_link_opened','AISHA35')}maybePrompt();if(d.v==='aisha'&&A.notice){const n=A.notice;A.notice=null;setTimeout(()=>toast(n),700)}break;
  case 'tab':S.tab=d.v;S.sub=null;break;
  case 'back':if(S.sub==='wallet'||S.sub==='refer'){S.sub=null;S.tab='profile'}else if(S.who==='omar'&&O.stage==='signup')O.stage='landing';else if(S.who==='omar'&&O.stage==='otp')O.stage='signup';else S.sub=null;break;
  case 'story':S.sheet='story';break;
  case 'tglIssue':S.issue=!S.issue;break;
  case 'tglExisting':if(O.stage==='landing')O.existing=!O.existing;break;
  case 'reset':S=seed();maybePrompt();break;
  case 'close':if(S.sheet==='nudge1'||S.sheet==='nudge2')A.dismiss++;if(S.sheet==='nudge1')A.nudge1=false;S.sheet=null;S.sd=null;break;
  case 'later':if(S.sheet==='nudge1')A.nudge1=false;S.sheet=null;A.dismiss++;break;
  case 'nreferX':A.nudge1=false;A.dismiss=0;S.sheet='invite';S.sd=null;track('nudge_tapped','Refer now');break;
  case 'refer':S.sheet=null;S.tab='profile';S.sub='refer';break;
  case 'info':S.sheet='info';break;
  case 'wallet':S.sub='wallet';break;
  case 'lvlprev':S.sheet='lvl';S.sd=+d.v;break;
  case 'invite':S.sheet='invite';break;
  case 'contacts':R().contacts=true;break;
  case 'cinvite':S.sheet='contact';S.sd=d.v;break;
  case 'send':if(d.w)R().cst[d.w]='invited';if(S.who==='omar'&&d.w&&!O.friends.find(f=>f.n===d.w))O.friends.push({n:d.w,s:'invited'});S.omarInv=S.who==='aisha'&&d.w==='Omar R.';if(S.omarInv)setFriend('Omar R.','invited');S.sheet='confirm';S.sd=d.v==='Copy link'?'Link copied':'Invite sent';track('invite_sent',d.v);setTimeout(()=>burst(60),160);break;
  case 'done':S.omarInv=false;S.sheet=null;S.sd=null;S.tab='home';S.sub=null;break;
  case 'areveal':if(S.who==='omar')O.rrev=true;else A.revealed=true;setTimeout(()=>burst(46),40);break;
  case 'oreveal':O.revealed=true;setTimeout(()=>burst(46),40);setTimeout(()=>{if(S.who==='omar'&&!S.sheet&&S.tab==='home'&&!S.sub&&S.o.stage==='app'&&S.o.orders.length===0){S.sheet='buildcart';render()}},1700);break;
  case 'startcart':S.sheet=null;S.sd=null;S.tab='home';S.sub=null;setTimeout(()=>{const p=document.querySelector('.mq')||document.querySelector('.plist');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})},160);break;
  case 'terms':S.sheet='terms';break;
  case 'join':O.stage='signup';break;
  case 'otp':O.stage='otp';break;
  case 'verify':O.stage='app';S.tab='home';S.sub='welcome';S.wk=1;track('signup_verified','');
    if(O.existing){O.revealed=true;S.sheet='inelig';track('referral_ineligible','existing customer')}
    else{O.ledger.unshift({id:'W1',t:'Referral welcome credit',amt:CFG.reward,st:'ok',exp:inDays(CFG.expiryDays),note:'Valid until '+inDays(CFG.expiryDays)});setFriend('Omar R.','joined');track('wallet_credited','AED '+CFG.reward)}break;
  case 'starter':cur().cart={...STARTER};break;
  case 'inc':{const c=cur().cart;c[d.v]=(c[d.v]||0)+1;break}
  case 'dec':{const c=cur().cart;c[d.v]=(c[d.v]||0)-1;if(c[d.v]<=0)delete c[d.v];break}
  case 'sel':O.sel=+d.v;break;
  case 'checkout':if(S.who==='aisha')placeAisha();else placeOmar();break;
  case 'placedOk':S.sheet=null;S.sd=null;if(S.who==='omar')S.sub='welcome';else S.tab='home';maybePrompt();break;
  case 'wdone':S.sub=null;S.wk=0;S.tab='home';break;
  case 'deliver':{O.orders[O.orders.length-1].status='delivered';track('first_order_delivered','');const e=A.ledger.find(x=>x.id==='L2');if(e&&e.st==='pending'){e.st='ok';e.note="Friend's first order delivered";setFriend('Omar R.','paid');A.rewardPrompt=true;setTimeout(()=>burst(40),60);track('reward_credited','AED '+CFG.reward+' (hold cleared, demo)')}break}
  case 'adeliver':{const l=A.orders[A.orders.length-1];l.status='delivered';
    maybePrompt();break}
  case 'reorder':O.cart={...STARTER};O.sel=null;S.tab='cart';track('reorder_one_tap','');break;
  }
  render()}

function credSteps(){const b=bal(S.o.ledger),m=Math.min(b,CFG.maxUse);if(subtotal()<CFG.minBasket||m<=0)return[];const s=CFG.options.filter(v=>v<=m);if(!s.includes(m))s.push(m);return s.sort((a,c)=>a-c)}
document.addEventListener('input',e=>{if(e.target.id!=='crd')return;const ops=credSteps(),i=+e.target.value;S.o.sel=ops[i];const v=$('#slv');if(v)v.textContent='AED '+S.o.sel;e.target.style.setProperty('--p',(ops.length>1?i/(ops.length-1)*100:100)+'%');document.querySelectorAll('.slide .tk span').forEach((x,j)=>x.classList.toggle('on',j===i))});
document.addEventListener('change',e=>{if(e.target.id==='crd')render()});

function chime(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=window._ac||(window._ac=new C()),t=c.currentTime;[[880,0],[1318.5,.12]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.05,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.5);o.connect(g);g.connect(c.destination);o.start(t+d);o.stop(t+d+.55)})}catch(e){}}
function burst(n){chime();try{navigator.vibrate&&navigator.vibrate([18,40,18])}catch(e){}const h=$('#phone');if(!h||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('div');c.className='cf';const cols=['#f0c354','#ffffff','#e8458a','#6fd1ff','#7bd88f','#a78bfa'];let s='';for(let i=0;i<(n||46);i++){const a=Math.random()*Math.PI*2,d=90+Math.random()*200;s+=`<i style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-90}px;--r:${Math.random()*720-360}deg;--c:${cols[i%6]};--w:${5+Math.random()*7}px;--t:${1.2+Math.random()*.9}s;--dl:${Math.random()*.18}s"></i>`}c.innerHTML=s;h.appendChild(c);setTimeout(()=>c.remove(),2600)}
function countUps(){document.querySelectorAll('[data-count]').forEach(el=>{const id=el.dataset.id;if(id){if(S.anim[id])return;S.anim[id]=1}const to=+el.dataset.count,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(f)};el.textContent=0;requestAnimationFrame(f)})}
setInterval(()=>{const b=document.querySelector('.lp .ban');if(!b||!b.firstElementChild)return;const w=b.firstElementChild.offsetWidth+12;b.scrollTo({left:(b.scrollLeft+w>b.scrollWidth-b.clientWidth+4)?0:b.scrollLeft+w,behavior:'smooth'})},3200);

setInterval(()=>{const w=document.querySelector('.bnr');if(!w)return;const s=[...w.querySelectorAll('.banner')],d=[...w.querySelectorAll('.dots u')];let i=s.findIndex(x=>x.classList.contains('on'));i=(i+1)%s.length;S.bn=i;s.forEach((x,k)=>x.classList.toggle('on',k===i));d.forEach((x,k)=>x.classList.toggle('on',k===i))},3600);

function toast(t){const h=$('#phone');if(!h)return;const d=document.createElement('div');d.className='toast';d.innerHTML=`<em>🎉</em><div><b>CARREFOUR</b>${t}</div>`;h.appendChild(d);setTimeout(()=>d.remove(),4700)}

function miniBurst(x,y){const cols=['#f0c354','#fff','#e8458a','#6fd1ff'];for(let i=0;i<12;i++){const d=document.createElement('i');d.className='mini';d.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%4]}`;document.body.appendChild(d);const a=Math.random()*6.28,k=26+Math.random()*46;d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*k}px,${Math.sin(a)*k}px) scale(.2)`,opacity:0}],{duration:600+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>d.remove()}}
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.cn');if(c){const r=c.getBoundingClientRect();miniBurst(r.left+r.width/2,r.top+r.height/2);c.style.visibility='hidden'}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a=inc]');if(!b||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const from=(b.closest('.prod,.dl')||b).querySelector('.pe,em')||b,r=from.getBoundingClientRect();const t=[...document.querySelectorAll('.cartb,#nav [data-v=cart]')].find(x=>x.offsetParent&&x.getBoundingClientRect().width);if(!t)return;const tr=t.getBoundingClientRect(),dx=tr.left+tr.width/2-r.left-r.width/2,dy=tr.top+tr.height/2-r.top-r.height/2;const f=document.createElement('div');f.textContent=from.textContent.trim().slice(0,2)||'🛒';f.style.cssText=`position:fixed;left:${r.left+r.width/2-16}px;top:${r.top+r.height/2-16}px;font-size:30px;z-index:90;pointer-events:none`;document.body.appendChild(f);f.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.45}px,${dy*.2-70}px) scale(1.25)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:.25}],{duration:780,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>f.remove()},true);
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const t=e.target.closest&&e.target.closest('.wcard,.hero[data-a=refer],.tkt,.won,.dl');document.querySelectorAll('.tilt.on').forEach(x=>{if(x!==t){x.style.transform='';x.classList.remove('on')}});if(!t)return;t.classList.add('tilt','on');const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(700px) rotateX(${(-y*8).toFixed(2)}deg) rotateY(${(x*10).toFixed(2)}deg)`});
setInterval(()=>{const c=document.querySelector('.cd');if(!c)return;const n=new Date(),m=new Date(n);m.setHours(23,59,59,999);const s=Math.max(0,Math.floor((m-n)/1000)),p=v=>String(v).padStart(2,'0');c.textContent=p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)},1000);
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();act(el.dataset.a,el.dataset)});
act('reset',{});

window.HM=0;window.HT=0;
(function(){const red=matchMedia('(prefers-reduced-motion:reduce)').matches;
document.addEventListener('click',e=>{const T=e.target&&e.target.closest?e.target:null;if(!T)return;
 const m=T.closest('.hx .mt'),t=T.closest('.hx .ct2'),f=T.closest('.fav'),b=T.closest('[data-a=inc]');
 const sel=(el,key)=>{const a=[...el.parentNode.children];window[key]=a.indexOf(el);a.forEach(x=>x.classList.toggle('on',x===el));el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')};
 if(m)sel(m,'HM');if(t)sel(t,'HT');
 if(f){const id=+f.dataset.fav;FAVS.has(id)?FAVS.delete(id):FAVS.add(id);f.classList.toggle('on',FAVS.has(id));if(FAVS.has(id)&&!red){const r=f.getBoundingClientRect();miniBurst(r.left+r.width/2,r.top+r.height/2)}}
 if(b&&!red){const r=b.getBoundingClientRect(),p=document.createElement('i');p.className='plus1';p.textContent='+1';p.style.cssText='left:'+(r.left+r.width/2)+'px;top:'+r.top+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),900)}});
const q=['Search <b>50,000+</b> items','Try \u201Cbasmati rice\u201D','Try \u201Cfresh milk\u201D','Try \u201Colive oil\u201D'],r=['Rapid delivery \u00B7 24 mins to your area','Fresh produce restocked this morning','Pick a slot that suits you','Refer a friend, you both get AED '+CFG.reward];let i=0;

const main=document.getElementById('main'),ph=document.getElementById('phone');
if(main&&ph){const bar=document.createElement('div');bar.className='spr';ph.appendChild(bar);const up=document.createElement('button');up.className='totop';up.innerHTML='\uD83D\uDE80';up.setAttribute('aria-label','Back to top');ph.appendChild(up);
 main.addEventListener('scroll',()=>{const m=main.scrollHeight-main.clientHeight;bar.style.width=(m>0?main.scrollTop/m*100:0)+'%';up.classList.toggle('show',main.scrollTop>500);const h=document.querySelector('.hx');if(h)h.style.setProperty('--sy',Math.min(main.scrollTop,300))},{passive:true});
 up.onclick=()=>main.scrollTo({top:0,behavior:'smooth'})}
if(matchMedia('(hover:hover)').matches&&!red){let last=0;document.addEventListener('pointermove',e=>{const n=Date.now();if(n-last<70)return;last=n;const s=document.createElement('i');s.className='trail';s.style.cssText='left:'+e.clientX+'px;top:'+e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),700)})}
})();

setInterval(()=>{const x=d();if(!x||!x.firstElementChild||Date.now()<hold||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const w=x.firstElementChild.offsetWidth+12;x.scrollTo({left:(x.scrollLeft+w>x.scrollWidth-x.clientWidth+4)?0:x.scrollLeft+w,behavior:'smooth'})},3000)})();

(function(){let n=0;document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('[data-a=inc]');if(!b)return;const t=document.createElement('div');t.className='toast';const m=['Added to cart \uD83D\uDED2','Nice pick \u2728','Fresh choice \uD83E\uDD6C','Added \uD83C\uDF89'];t.textContent=m[n++%m.length];document.querySelectorAll('.toast').forEach(x=>x.remove());document.body.appendChild(t);setTimeout(()=>t.remove(),1700)})})();
